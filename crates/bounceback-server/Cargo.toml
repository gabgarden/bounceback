[package]
name = "bounceback-server"
version = "0.1.0"
edition = "2021"

[dependencies]
bounceback-core = { path = "../bounceback-core" }
axum = "0.7"
tokio = { version = "1.41", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
