[package]
name = "bounceback-core"
version = "0.1.0"
edition = "2021"
authors = ["BounceBack Contributors"]
description = "High-performance DAW Version Control engine for Ableton Live"

[dependencies]
flate2 = "1.0"
quick-xml = "0.37"
blake3 = "1.5"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3.14"
